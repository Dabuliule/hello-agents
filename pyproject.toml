[project]
name = "codecraft"
version = "0.1.0a3"
description = "Open-source coding agent with governed tool execution and traceable runtime events."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "weipengtao", email = "wei_pengtao@qq.com" },
]
keywords = ["agent", "coding-agent", "cli", "runtime", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "jsonschema>=4.26,<5",
    "mcp>=1.28,<2",
    "openai>=2.36.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3,<7",
    "rich>=14.0.0",
    "textual>=8.2,<9",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "typer>=0.25.1",
]

[project.urls]
Homepage = "https://github.com/Dabuliule/codecraft"
Repository = "https://github.com/Dabuliule/codecraft"
Issues = "https://github.com/Dabuliule/codecraft/issues"

[project.scripts]
codecraft = "codecraft.cli.app:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codecraft = ["prompt/resources/*.md", "tui/*.tcss"]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=9.0.3",
    "pytest-cov>=6,<8",
    "ruff>=0.15.13",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "integration: requires a native or external sandbox runtime",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/codecraft"]
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
branch = true
source = ["codecraft"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
