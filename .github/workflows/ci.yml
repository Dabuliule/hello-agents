name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits
        shell: bash
        run: |
          set -euo pipefail

          regex='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            range="${base}..${head}"
          else
            before="${{ github.event.before }}"
            head="${{ github.sha }}"

            if [[ "${before}" =~ ^0+$ ]]; then
              range="${head}"
            else
              range="${before}..${head}"
            fi
          fi

          invalid=0
          commits="$(git rev-list --no-merges "${range}")"

          for commit in ${commits}; do
            subject="$(git log -1 --pretty=%s "${commit}")"

            if ! [[ "${subject}" =~ ${regex} ]]; then
              echo "Invalid commit message: ${subject}"
              invalid=1
            fi
          done

          if [ "${invalid}" -ne 0 ]; then
            echo "Commit messages must follow Conventional Commits."
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest with coverage
        run: uv run pytest --cov=codecraft --cov-report=term-missing:skip-covered

      - name: Build package
        run: uv build

  docker-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Build sandbox image
        run: docker build -f docker/sandbox.Dockerfile -t codecraft-sandbox:py311 docker

      - name: Test Docker sandbox
        env:
          CODECRAFT_RUN_DOCKER_TESTS: "1"
        run: uv run pytest -q -m integration tests/test_docker_sandbox_integration.py

  native-sandbox:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            test: tests/test_native_sandbox_integration.py::test_seatbelt_enforces_write_network_and_environment_boundaries
          - os: ubuntu-latest
            test: tests/test_native_sandbox_integration.py::test_bubblewrap_enforces_write_network_and_environment_boundaries

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Test native sandbox
        env:
          CODECRAFT_RUN_BUBBLEWRAP_TESTS: "1"
          CODECRAFT_RUN_NATIVE_SANDBOX_TESTS: "1"
        run: uv run pytest -q -m integration "${{ matrix.test }}"
